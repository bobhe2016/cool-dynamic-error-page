<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 - 服务暂不可用</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c1: #e11d48; --c2: #f43f5e; --c3: #fb7185;
      --bg1: #1a0410; --bg2: #2d0a1c; --bg3: #120210;
      --glow1: rgba(244,114,182,0.22); --glow2: rgba(190,24,93,0.2);
      --btn-bg-start: #e11d48; --btn-bg-end: #be123c;
      --btn-shadow: rgba(225,29,72,0.4);
      --btn-shadow-hover: rgba(225,29,72,0.6);
      --ring-color: rgba(244,114,182,0.1);
      --text-primary: #fce7f3; --text-muted: rgba(249,168,212,0.85);
      --border-color: rgba(251,113,133,0.25);
      --border-hover: rgba(251,113,133,0.5);
      --btn-outline-color: #fda4af;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 30%, var(--bg3) 60%, #120210 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }

    .ripple-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 47% 53%, transparent 0%, transparent 38%, rgba(244,114,182,0.04) 38%, rgba(244,114,182,0.04) 40%, transparent 40%),
        radial-gradient(circle at 53% 47%, transparent 0%, transparent 48%, rgba(244,114,182,0.05) 48%, rgba(244,114,182,0.05) 50%, transparent 50%),
        radial-gradient(circle at 48% 52%, transparent 0%, transparent 58%, rgba(244,114,182,0.03) 58%, rgba(244,114,182,0.03) 60%, transparent 60%),
        radial-gradient(circle at 52% 48%, transparent 0%, transparent 68%, rgba(244,114,182,0.04) 68%, rgba(244,114,182,0.04) 70%, transparent 70%),
        radial-gradient(circle at 50% 50%, transparent 0%, transparent 78%, rgba(244,114,182,0.03) 78%, rgba(244,114,182,0.03) 80%, transparent 80%);
      animation: ripple-pulse 6s ease-in-out infinite;
    }
    @keyframes ripple-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .glow-orb {
      position: fixed; border-radius: 50%; filter: blur(120px);
      pointer-events: none; z-index: 0; animation: float 7.5s ease-in-out infinite;
    }
    .glow-orb.orb-1 { width: 500px; height: 500px; background: var(--glow1); top: -10%; left: -10%; animation-delay: 0s; }
    .glow-orb.orb-2 { width: 400px; height: 400px; background: var(--glow2); bottom: -10%; right: -8%; animation-delay: -3.5s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-30px, 35px) scale(1.05); }
      66% { transform: translate(35px, -25px) scale(0.95); }
    }

    .rain-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .drop {
      position: absolute; background: linear-gradient(180deg, transparent, rgba(244,114,182,0.6));
      border-radius: 0 0 3px 3px;
      animation: fall var(--dur) linear infinite; animation-delay: var(--delay);
    }
    @keyframes fall {
      0% { opacity: 0; transform: translateY(-100px); }
      10% { opacity: 0.6; } 90% { opacity: 0.1; }
      100% { opacity: 0; transform: translateY(calc(100vh + 100px)); }
    }

    .main-wrapper { position: relative; z-index: 1; text-align: center; padding: 2rem; }

    .error-code {
      font-size: clamp(8rem, 18vw, 14rem); font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 40%, var(--c3) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: -0.03em; background-size: 200% 200%;
      animation: shimmer 2.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .divider {
      width: 80px; height: 3px;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
      border-radius: 2px; margin: 1.5rem auto;
      animation: pulse-line 2s ease-in-out infinite;
    }
    @keyframes pulse-line {
      0%, 100% { width: 80px; opacity: 0.7; }
      50% { width: 140px; opacity: 1; }
    }

    .domain-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px; padding: 0.45rem 1.3rem; margin-bottom: 1.8rem;
      backdrop-filter: blur(10px); animation: fadeInUp 0.8s ease-out;
    }
    .domain-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c2); box-shadow: 0 0 8px var(--c2); animation: pulse-dot 2s ease-in-out infinite; }
    .domain-badge .domain-text { font-size: 0.9rem; font-weight: 500; color: var(--text-primary); letter-spacing: 0.01em; }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 4px var(--c2); }
      50% { box-shadow: 0 0 14px var(--c2), 0 0 24px var(--c3); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .request-path {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem; color: var(--text-muted);
      background: rgba(0,0,0,0.3); border-radius: 6px;
      padding: 0.3rem 0.8rem; display: inline-block;
      margin-bottom: 1.5rem; word-break: break-all; max-width: 90%;
      border: 1px solid rgba(255,255,255,0.06);
      animation: fadeInUp 0.8s ease-out 0.15s both;
    }

    .error-title { font-size: 1.75rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem; letter-spacing: 0.02em; }
    .error-desc { font-size: 1rem; font-weight: 300; color: var(--text-muted); max-width: 500px; margin: 0 auto 2.2rem; line-height: 1.8; }

    .btn-group-custom .btn {
      font-weight: 500; letter-spacing: 0.03em; padding: 0.7rem 2rem;
      border-radius: 50px; font-size: 0.95rem; transition: all 0.35s ease;
    }
    .btn-primary-glow {
      background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
      border: none; color: #fff; box-shadow: 0 4px 25px var(--btn-shadow);
    }
    .btn-primary-glow:hover {
      box-shadow: 0 8px 40px var(--btn-shadow-hover);
      transform: translateY(-2px); color: #fff;
    }
    .btn-outline-light-custom {
      background: transparent; border: 1.5px solid var(--border-color);
      color: var(--btn-outline-color);
    }
    .btn-outline-light-custom:hover {
      background: rgba(251,113,133,0.08); border-color: var(--border-hover);
      color: #fff; transform: translateY(-2px);
    }

    .ring-outer {
      position: fixed; pointer-events: none; z-index: 0;
      width: 500px; height: 500px; top: 50%; left: 50%;
      transform: translate(-50%, -50%); border: 1px solid var(--ring-color);
      border-radius: 50%; animation: expand-ring 5s ease-out infinite;
    }
    .ring-mid {
      position: fixed; pointer-events: none; z-index: 0;
      width: 350px; height: 350px; top: 50%; left: 50%;
      transform: translate(-50%, -50%); border: 1px solid rgba(244,114,182,0.12);
      border-radius: 50%; animation: expand-ring 5s ease-out infinite;
      animation-delay: -1.5s;
    }
    .ring-inner {
      position: fixed; pointer-events: none; z-index: 0;
      width: 200px; height: 200px; top: 50%; left: 50%;
      transform: translate(-50%, -50%); border: 1.5px solid rgba(244,114,182,0.15);
      border-radius: 50%; animation: expand-ring 5s ease-out infinite;
      animation-delay: -3s;
    }
    @keyframes expand-ring {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    @media (max-width: 576px) {
      .error-code { font-size: 6rem; }
      .error-title { font-size: 1.3rem; }
      .error-desc { font-size: 0.9rem; padding: 0 1rem; }
      .btn-group-custom .btn { padding: 0.6rem 1.5rem; font-size: 0.85rem; display: block; width: 100%; margin-bottom: 0.6rem; }
      .domain-badge { padding: 0.35rem 1rem; }
      .domain-badge .domain-text { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="ripple-bg"></div>
  <div class="ring-outer"></div>
  <div class="ring-mid"></div>
  <div class="ring-inner"></div>
  <div class="rain-particles" id="rain"></div>

  <div class="main-wrapper">
    <div class="domain-badge">
      <span class="dot"></span>
      <span class="domain-text" id="domainDisplay"></span>
    </div>
    <div class="error-code">503</div>
    <div class="divider"></div>
    <h1 class="error-title">服务暂时不可用</h1>
    <div class="request-path" id="pathDisplay"></div>
    <p class="error-desc">
      服务器正在维护或暂时过载，请稍后刷新页面重试。给您带来不便敬请谅解。
    </p>
    <div class="btn-group-custom">
      <a href="/" class="btn btn-primary-glow mr-2 mr-sm-3 mb-2 mb-sm-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        返回首页
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-light-custom">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px;">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        返回上页
      </a>
    </div>
  </div>

  <script>
    (function() {
      // ===== 随机配色引擎 (玫红色系: hue 335~360) =====
      var hue = 335 + Math.random() * 25;
      var sat = 75 + Math.random() * 20;
      var c1 = hslToHex(hue, sat, 50);
      var c2 = hslToHex(hue + 12, sat + 5, 48);
      var c3 = hslToHex(hue + 22, sat - 5, 55);

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        var a = s * Math.min(l, 1 - l);
        var f = function(n) {
          var k = (n + h / 30) % 12;
          return Math.round((l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)))) * 255).toString(16).padStart(2, '0');
        };
        return '#' + f(0) + f(8) + f(4);
      }
      function hexToRgb(hex) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        return r + ',' + g + ',' + b;
      }

      var root = document.documentElement.style;
      root.setProperty('--c1', c1);
      root.setProperty('--c2', c2);
      root.setProperty('--c3', c3);
      root.setProperty('--bg1', hslToHex(hue, 45, 4));
      root.setProperty('--bg2', hslToHex(hue + 5, 40, 7));
      root.setProperty('--bg3', hslToHex(hue - 5, 30, 4));
      root.setProperty('--glow1', 'rgba(' + hexToRgb(c2) + ',0.22)');
      root.setProperty('--glow2', 'rgba(' + hexToRgb(c1) + ',0.2)');
      root.setProperty('--btn-bg-start', c1);
      root.setProperty('--btn-bg-end', hslToHex(hue - 2, 80, 38));
      root.setProperty('--btn-shadow', 'rgba(' + hexToRgb(c1) + ',0.4)');
      root.setProperty('--btn-shadow-hover', 'rgba(' + hexToRgb(c1) + ',0.6)');

      // ===== 域名 & 路径 =====
      var host = window.location.hostname || 'unknown';
      var path = window.location.pathname || '/';
      document.getElementById('domainDisplay').textContent = host;
      document.getElementById('pathDisplay').textContent = host + path + (window.location.search || '');

      // ===== 雨滴粒子 =====
      var c = document.getElementById('rain'), f = document.createDocumentFragment();
      for (var i = 0; i < 60; i++) {
        var d = document.createElement('div'); d.className = 'drop';
        d.style.cssText =
          'left:' + (Math.random()*100) + '%;width:2px;' +
          'height:' + (Math.random()*30+15) + 'px;' +
          '--dur:' + (Math.random()*2+2.5) + 's;' +
          '--delay:' + (Math.random()*5) + 's;';
        f.appendChild(d);
      }
      c.appendChild(f);
    })();
  </script>
</body>
</html>
